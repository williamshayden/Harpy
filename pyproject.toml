[project]
name = "harpy-audio"
version = "1.0.0"
description = "A constrained audio-control benchmark and learning toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium>=1.3,<2",
  "numpy>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/williamshayden/Harpy"
Issues = "https://github.com/williamshayden/Harpy/issues"

[project.optional-dependencies]
pitch = [
  "torch>=2.8,<3",
]
train = [
  "stable-baselines3==2.9.0",
  "torch>=2.8,<3",
]

[project.scripts]
harpy = "harpy.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harpy"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/**",
  "/docs/v1-*.md",
  "/docs/reviews/2026-09-09-v1-release-review.md",
  "/docs/verification/2026-09-08-pitch-decoding-v1.md",
  "/docs/verification/2026-09-08-v1-respec-qualification.md",
  "/docs/verification/v1-respec/**",
  "/examples/**",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE*",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp --capture=sys"
testpaths = ["tests"]
markers = [
  "integration: exhaustive contracts that exercise the real renderer",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
